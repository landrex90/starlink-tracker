databases:
  - name: starlink-tracker-db
    plan: free
    databaseName: starlink_tracker
    user: starlink_tracker

services:
  - name: starlink-tracker
    type: web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx drizzle-kit push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: starlink-tracker-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: STARLINK_ACCOUNTS
        sync: false
      # Opcional: si más adelante quieres automatizar la sincronización gratis
      # (p.ej. un GitHub Actions workflow con cron que llame a /api/starlink/sync
      # con este bearer token), define un valor aquí. Sin esto, la sincronización
      # es manual vía el botón "Sync now" del dashboard.
      - key: CRON_SECRET
        sync: false
